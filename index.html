<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 450px; 
            overflow: hidden;
        }
        
        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 130%; 
            object-fit: cover;
            display: block;
            will-change: transform;
        }
        
        .image-container .overlay-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 2;
        }
        
        
        .image-container h1 {
            color: #ffffff;
            font-size: clamp(1.8rem, 4vw, 3rem); 
            font-weight: 700;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            letter-spacing: 1.5px;
            margin: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .scroll-test {
            height: 800px;
            background: #f1f5f9;
            text-align: center;
            padding-top: 50px;
            color: #334155;
        }
    </style>
</head>
<body>

    <section>
        <div class="image-container">
            <img src="pexels-saadbinhasan-35487002.jpg" alt="Background" id="parallaxImage">
            <div class="overlay-text">
                <h1>Start your journey with us</h1>
            </div>
        </div>
    </section>

    <div class="scroll-test">
        <h2>Application form</h2>
    </div>


    <script>
        let ticking = false;

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(function() {
                    const scrollPosition = window.pageYOffset;
                    const bgImage = document.getElementById('parallaxImage');
                    
                  
                    bgImage.style.transform = 'translateY(' + (scrollPosition * 0.35) + 'px)';
                    ticking = false;
                });
                ticking = true;
            }
        });
    </script>

</body>
</html>

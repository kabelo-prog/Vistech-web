<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
        }

       
        .image-container {
            position: relative;
            width: 100%;
            height: 450px; 
            overflow: hidden;
        }
        
        .image-container img {
            position: absolute;
            top: -20%;
            left: 0;
            width: 100%;
            height: 140%;
            object-fit: cover;
            display: block;
            will-change: transform;
            z-index: 1;
        }
        
        .image-container .overlay-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            z-index: 2;
        }
        
        .image-container h1 {
            color: #ffffff;
            font-weight: 700;
            font-size: clamp(1.8rem, 4vw, 3rem);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            letter-spacing: 1.5px;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 900px;
            margin: -50px auto 50px auto;
            padding: 0 20px;
            position: relative;
            z-index: 10;
        }

        .form-wrapper {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .main-title {
            text-align: center; 
            color: #b30000;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        h2, h3 {
            color: #b30000;
            margin-bottom: 15px;
        }

        fieldset {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 25px;
            margin-bottom: 25px;
            background: #fff;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            flex: 1;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #b30000;
            box-shadow: 0 0 4px rgba(179, 0, 0, 0.25);
        }

        textarea {
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit {
            background-color: #b30000;
            color: white;
        }

        .btn-submit:hover {
            background-color: #990000;
        }

        .btn-reset {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-reset:hover {
            background-color: #d0d0d0;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="pexels-safari-consoler-3290243-20240506.jpg" alt="Background" id="parallaxImage">
        <div class="overlay-text">
            <h1>Start your journey with us</h1>
        </div>
    </div>

    <div class="container">
        <div class="form-wrapper">
            <h1 class="main-title">Application Form</h1>
            <p class="subtitle">Please fill in all sections accurately to complete your application.</p>
            
            <form>
                <fieldset>
                    <h2>Course Selection</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="course">Select Course *</label>
                            <select id="course" name="course" required>
                                <option value="">-- Choose Course --</option>
                                <option value="cs">Bachelor of Computer Science</option>
                                <option value="ba">Bachelor of Business Administration</option>
                                <option value="eng">Bachelor of Engineering</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="studyMode">Study Mode *</label>
                            <select id="studyMode" name="studyMode" required>
                                <option value="">-- Choose Mode --</option>
                                <option value="full-time">Full-Time</option>
                                <option value="part-time">Part-Time</option>
                                <option value="online">Online / Distance</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="entryLevel">Entry Level *</label>
                            <select id="entryLevel" name="entryLevel" required>
                                <option value="">-- Choose Level --</option>
                                <option value="1">1st Year / Undergraduate</option>
                                <option value="2">2nd Year Transfer</option>
                                <option value="postgrad">Postgraduate</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="academicYear">Academic Year *</label>
                            <select id="academicYear" name="academicYear" required>
                                <option value="">-- Choose Year --</option>
                                <option value="2026">2026</option>
                                <option value="2027">2027</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

            
                <fieldset>
                    <h2>Personal Details</h2>
                    <div class="form-row">
                        <div class="form-group" style="flex: 0.5;">
                            <label for="title">Title *</label>
                            <select id="title" name="title" required>
                                <option value="">Select</option>
                                <option value="Mr">Mr</option>
                                <option value="Mrs">Mrs</option>
                                <option value="Ms">Ms</option>
                                <option value="Dr">Dr</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" placeholder="+1234567890" required>
                        </div>
                    </div>
                </fieldset>
                
          
                <fieldset>
                    <h2>Residential Details</h2>
                    <div class="form-group">
                        <label for="address">Street Address *</label>
                        <textarea id="address" name="address" rows="2" placeholder="Enter your full street address" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City / Town *</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="postalCode">Postal Code *</label>
                            <input type="text" id="postalCode" name="postalCode" required>
                        </div>
                        <div class="form-group">
                            <label for="country">Country *</label>
                            <input type="text" id="country" name="country" required>
                        </div>
                    </div>
                </fieldset>

               
                <fieldset>
                    <h2>Educational Background</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prevInstitution">Previous School / Institution *</label>
                            <input type="text" id="prevInstitution" name="prevInstitution" required>
                        </div>
                        <div class="form-group">
                            <label for="qualification">Highest Qualification Obtained *</label>
                            <input type="text" id="qualification" name="qualification" placeholder="e.g. High School Diploma, Bachelor's" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="gradYear">Year of Graduation / Completion *</label>
                            <input type="number" id="gradYear" name="gradYear" min="1950" max="2026" required>
                        </div>
                    </div>
                </fieldset>

       
                <fieldset>
                    <h2>Finances</h2>
                    <div class="form-group">
                        <label for="fundingSource">How will you fund your studies? *</label>
                        <select id="fundingSource" name="fundingSource" required>
                            <option value="">-- Select Funding Source --</option>
                            <option value="self">Self-Funded / Family</option>
                            <option value="loan">Student Loan</option>
                            <option value="scholarship">Scholarship / Bursary</option>
                            <option value="employer">Employer Sponsored</option>
                        </select>
                    </div>
                </fieldset>

            
                <fieldset>
                    <h2>Document Uploads</h2>
                    <div class="form-group">
                        <label for="idDocument">Upload ID / Passport Copy *</label>
                        <input type="file" id="idDocument" name="idDocument" accept=".pdf,.jpg,.png" required>
                    </div>
                    <div class="form-group">
                        <label for="transcripts">Upload Academic Transcripts / Certificates *</label>
                        <input type="file" id="transcripts" name="transcripts" accept=".pdf,.jpg,.png" required>
                    </div>
                </fieldset>

                <div class="button-group">
                    <button type="submit" class="btn btn-submit"><i class="fas fa-paper-plane"></i> Submit Application</button>
                    <button type="reset" class="btn btn-reset">Clear Form</button>
                </div>
            </form>
        </div>
    </div>

 
    <script>
        let ticking = false;

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(function() {
                    const scrollPosition = window.pageYOffset;
                    const bgImage = document.getElementById('parallaxImage');
                    
                  
                    bgImage.style.transform = 'translateY(' + (scrollPosition * 0.4) + 'px)';
                    ticking = false;
                });
                ticking = true;
            }
        });
    </script>

</body>
</html>

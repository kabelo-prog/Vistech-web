<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        .image-container {
            position: relative;
            width: 100%;
            height: 450px; 
            overflow: hidden;
        }
        
        .image-container img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 130%;
            object-fit: cover;
            display: block;
            will-change: transform;
        }
        
        .image-container .overlay-text {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-left: 540px;
            box-sizing: border-box;
            z-index: 2;
        }
        
        
        .image-container h1 {
            color: #ffffff;
            margin: 3px 50px;
            font-weight: 700;
            font-size: clamp(1.8rem, 4vw, 3rem);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            letter-spacing: 1.5px;
            margin: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
 
<section>
        <div class="image-container">
            <img src="pexels-saadbinhasan-35487002.jpg" alt="Background" id="parallaxImage">
            <div class="overlay-text">
                <h1>Start your journey with us</h1>
            </div>
        </div>

    <div class="container">
        <div class="form-wrapper">
                <h1 style="text-align: center; color: #888888;">Application form</h1><br>

            <p class="subtitle">Please fill in the form below to apply.</p>
            <form>

                <fieldset>
                    <h2>Personal Information</h2><br>
                    <div class="form-row">
                        <div class="choice">
                            <label for="firstName">Title *</label>
                            <select>
                            <option></option>
                            <option>Mr</option>
                            <option>Mrs</option>
                            <option>Ms</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" placeholder="" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" placeholder="" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone *</label>
                        <input type="tel" id="phone" name="phone" placeholder="">
                    </div>
                </fieldset>
                
                <fieldset>
                    <h3>Additional Information</h3><br>
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter your full address"></textarea>
                    </div>
                </fieldset>

                <div class="button-group">
                    <button type="submit" class="btn btn-submit"><i class="fas fa-paper-plane"></i> Submit</button>
                    </div>
            </form>
        </div>
    </div>
</section>


    <script>
        let ticking = false;

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(function() {
                    const scrollPosition = window.pageYOffset;
                    const bgImage = document.getElementById('parallaxImage');
                    
                  
                    bgImage.style.transform = 'translateY(' + (scrollPosition * 0.35) + 'px)';
                    ticking = false;
                });
                ticking = true;
            }
        });
    </script>

</body>
</html>

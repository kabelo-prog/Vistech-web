<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .image-container {
            position: relative;
            width: 100%;
            height: 450px; 
            overflow: hidden;
        }
        
        .image-container img {
            position: absolute;
            top: -20%;
            left: 0;
            width: 100%;
            height: 140%;
            object-fit: cover;
            display: block;
            will-change: transform;
            z-index: 1;
        }
        
        .image-container .overlay-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            z-index: 2;
        }
        
        .image-container h1 {
            color: #ffffff;
            margin: 3px 50px;
            font-weight: 700;
            font-size: clamp(1.8rem, 4vw, 3rem);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
            letter-spacing: 1.5px;
            margin: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            width: 100%;
            padding: 20px;
        }

        .form-wrapper {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: 0 auto;
        }

        .subtitle {
            color: #666 !important;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        h2 {
            color: #b30000;
        }

        h3 {
            color: #b30000;
        }

        fieldset {
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 40px;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            flex: 1;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .choice {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            flex: 1;
        }

        .choice select {
            height: 42px;
            width: 100%;
            border-radius: 4px;
            border: 1px solid #ccc;
            color: #b30000;
            font-weight: bold;
            padding: 0 10px;
        }

        .choice option {
            font-weight: bold;
            text-transform: uppercase;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }

        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 4px rgba(0, 123, 255, 0.25);
        }

        textarea {
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit {
            background-color: #b30000;
            color: white;
        }

        .btn-submit:hover {
            background-color: #f50000;
        }

        .btn-reset {
            background-color: #e0e0e0;
            color: #b30000;
        }

        .btn-reset:hover {
            background-color: #d0d0d0;
        }

        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
 
<section>
    <div class="image-container" style="background-position: center;background-size: cover;">
        <img src="pexels-oacthecreator-10604063.jpg" alt="Background" id="parallaxImage">
        <div class="overlay-text">
            <h1>Start your journey with us</h1>
        </div>
    </div>

    <div class="container">
        <div class="form-wrapper">
            <h1 style="text-align: center; color: #888888;">Application form</h1><br>

            <p class="subtitle">Please fill in the form below to apply.</p>
            <form>

              
                <fieldset>
                    <h2>Course Selection</h2><br>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="selectCourse">Select Course *</label>
                            <select id="selectCourse" name="selectCourse" required>
                                <option value=""></option>
                                <option value="computer-science">Computer Science</option>
                                <option value="business-admin">Business Administration</option>
                                <option value="engineering">Engineering</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="studyMode">Study Mode *</label>
                            <select id="studyMode" name="studyMode" required>
                                <option value=""></option>
                                <option value="full-time">Full-Time</option>
                                <option value="part-time">Part-Time</option>
                                <option value="online">Online</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="entryLevel">Entry Level *</label>
                            <select id="entryLevel" name="entryLevel" required>
                                <option value=""></option>
                                <option value="undergraduate">Undergraduate</option>
                                <option value="postgraduate">Postgraduate</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="academicYear">Academic Year *</label>
                            <select id="academicYear" name="academicYear" required>
                                <option value=""></option>
                                <option value="2026">2026</option>
                                <option value="2027">2027</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <fieldset>
                    <h2>Personal Details</h2><br>
                    <div class="form-row">
                        <div class="choice">
                            <label for="title">Title *</label>
                            <select id="title" name="title">
                                <option></option>
                                <option>Mr</option>
                                <option>Mrs</option>
                                <option>Ms</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone *</label>
                            <input type="tel" id="phone" name="phone">
                        </div>
                    </div>
                </fieldset>
                
          
                <fieldset>
                    <h3>Residential Details</h3><br>
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter your full address"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city">
                        </div>
                        <div class="form-group">
                            <label for="postalCode">Postal Code *</label>
                            <input type="text" id="postalCode" name="postalCode">
                        </div>
                    </div>
                </fieldset>

                
                <fieldset>
                    <h3>Educational Background</h3><br>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="highestQual">Highest Qualification *</label>
                            <input type="text" id="highestQual" name="highestQual">
                        </div>
                        <div class="form-group">
                            <label for="institution">Institution Name *</label>
                            <input type="text" id="institution" name="institution">
                        </div>
                    </div>
                </fieldset>

            
                <fieldset>
                    <h3>Finances</h3><br>
                    <div class="form-group">
                        <label for="fundingSource">Funding Source *</label>
                        <select id="fundingSource" name="fundingSource">
                            <option value=""></option>
                            <option value="self">Self / Family</option>
                            <option value="loan">Student Loan</option>
                            <option value="scholarship">Scholarship</option>
                        </select>
                    </div>
                </fieldset>

              
                <fieldset>
                    <h3>Document Uploads</h3><br>
                    <div class="form-group">
                        <label for="idDoc">ID / Passport Document *</label>
                        <input type="file" id="idDoc" name="idDoc">
                    </div>
                    <div class="form-group">
                        <label for="certificates">Certificates / Transcripts *</label>
                        <input type="file" id="certificates" name="certificates">
                    </div>
                </fieldset>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-submit"><i class="fas fa-paper-plane"></i> Submit</button>
                    <button type="reset" class="btn btn-reset">Reset</button>
                </div>
            </form>
        </div>
    </div>
</section>

    <script>
        let ticking = false;

        window.addEventListener('scroll', function() {
            if (!ticking) {
                window.requestAnimationFrame(function() {
                    const scrollPosition = window.pageYOffset;
                    const bgImage = document.getElementById('parallaxImage');
                    
                    bgImage.style.transform = 'translateY(' + (scrollPosition * 0.35) + 'px)';
                    ticking = false;
                });
                ticking = true;
            }
        });
    </script>

</body>
</html>
